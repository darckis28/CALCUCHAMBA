<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">CalculaChamba — ícono CC</title>
  <desc id="desc">Monograma minimalista de dos letras C, blanca y cian, sobre un fondo azul oscuro con esquinas redondeadas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#042448"/>
      <stop offset="0.55" stop-color="#063c69"/>
      <stop offset="1" stop-color="#057ca2"/>
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="9%" r="95%">
      <stop offset="0" stop-color="#18b1d0" stop-opacity=".27"/>
      <stop offset="1" stop-color="#18b1d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aqua" x1=".12" y1="0" x2=".9" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#00e4ed"/>
