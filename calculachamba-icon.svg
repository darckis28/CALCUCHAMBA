  <rect width="512" height="512" rx="92" fill="url(#background)"/>
  <rect width="512" height="512" rx="92" fill="url(#glow)"/>
  <path d="M 273 191 A 94 94 0 1 0 273 321" fill="none" stroke="#f9fcff" stroke-width="60"/>
  <path d="M 380 191 A 94 94 0 1 0 380 321" fill="none" stroke="url(#aqua)" stroke-width="60"/>
  <path d="M 380 191 A 94 94 0 1 0 380 321" fill="none" stroke="#007fa2" stroke-width="60" mask="url(#left-letter)" opacity=".7"/>
